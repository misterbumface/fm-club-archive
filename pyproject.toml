[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions", "Logos", "trophies_graphics_pack", "archive"]

[tool.ruff.lint]
# Errors, undefined or unused names, and bug-prone patterns. No style rules.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",  # Flask and click use function calls as defaults on purpose
    "B023",  # The closures in the table parsers run inside the loop pass
    "B905",  # zip() without strict=
    "E731",  # Assigned lambdas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "F811", "F841"]  # F811: pytest fixtures imported from another test module
"run.py" = ["E402"]
